name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.11.0", "2026.11.2"]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip install --upgrade --force-reinstall "homeassistant==${{ matrix.homeassistant }}" "pytest-homeassistant==${{ matrix.homeassistant }}"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-report=xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test frontend model
        run: node --test tests/frontend/*.test.mjs
